{% extends "base.html" %}
{% block title %}Two-factor verification - IMS{% endblock %}
{% block content %}
<main>
  <h1>Enter authentication code</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}
    {% endfor %}
    <button type="submit">Verify</button>
  </form>
</main>
{% endblock %}
