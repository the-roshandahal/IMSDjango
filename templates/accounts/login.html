{% extends "base.html" %}
{% block title %}Login - IMS{% endblock %}
{% block content %}
<main>
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}
    {% endfor %}
    <button type="submit">Sign in</button>
  </form>
</main>
{% endblock %}
