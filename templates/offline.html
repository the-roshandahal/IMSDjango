<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — IMS</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1420; color: #e8edf2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 360px; }
  .dot { width: 48px; height: 48px; margin: 0 auto 20px; border-radius: 50%; background: #16789f; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { color: #9aa7b5; line-height: 1.5; margin: 0 0 20px; }
  button {
    font: inherit; padding: 10px 20px; border-radius: 6px; border: none;
    background: #16789f; color: #fff; cursor: pointer;
  }
  button:hover { background: #115a7a; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>You're offline</h1>
    <p>This page hasn't been loaded before, so it isn't available without a connection. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
