{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IMS{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  <link rel="icon" type="image/jpeg" sizes="200x200" href="{% static 'img/logo-mark.jpg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <img src="{% static 'img/logo-wordmark.jpg' %}" alt="Cleantech1" class="auth-logo">
      <div class="auth-sub">{% block auth_sub %}Inventory Management System{% endblock %}</div>
      {% if messages %}
        <ul class="messages">
          {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
        </ul>
      {% endif %}
      {% block content %}{% endblock %}
      <div class="auth-footer-link"><a href="{% url 'core_web:guide' %}">User Guide</a></div>
    </div>
  </div>
</body>
</html>
